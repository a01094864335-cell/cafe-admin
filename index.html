<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cafe Admin · 카페 운영 관리</title>
    <meta
      name="description"
      content="Cafe Admin 카페 운영 관리 — 로컬 HTML 프로토타입"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b4639'/%3E%3Ctext x='7' y='24' fill='white' font-size='24' font-family='serif'%3Ec%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">c</div>
          <div><strong>Cafe Admin</strong><small>CAFE ADMIN</small></div>
        </div>
        <div class="store">
          Cafe Admin 운영 장부<small>내 PC · 개인 장부</small>
        </div>
        <p class="nav-label">매장 운영</p>
        <nav class="nav" aria-label="주 메뉴" id="nav"></nav>
        <div class="side-foot">
          <div class="owner-avatar">사</div>
          <div>
            <strong>사장님 워크스페이스</strong>내 PC에 저장<span
              >LOCAL WORKSPACE</span
            >
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="crumb">
            워크스페이스 <span style="margin: 0 12px; color: #bbc4be">/</span>
            <b id="crumb">대시보드</b>
          </div>
          <div class="top-actions">
            <a href="/cloud.html">공유 장부</a>
            <button
              id="themeToggle"
              class="theme-toggle"
              type="button"
              data-action="theme"
              aria-label="다크 모드로 전환"
            >
              다크 모드</button
            ><span class="pill amber">로컬 장부</span
            ><span class="muted" id="saveState">저장 상태 확인 중</span>
            <div class="avatar" aria-label="사장님">사</div>
          </div>
        </header>
        <main class="main" id="main"></main>
      </div>
    </div>
    <dialog id="recordPicker" aria-labelledby="pickerTitle">
      <div class="dialog-head">
        <h2 id="pickerTitle">어떤 내용을 기록할까요?</h2>
        <button
          class="ghost"
          type="button"
          data-action="close-picker"
          aria-label="창 닫기"
        >
          ✕
        </button>
      </div>
      <div class="dialog-body">
        <p class="sub">등록할 항목을 선택하면 입력 화면이 열립니다.</p>
        <div class="quick">
          <button type="button" data-action="choose-record" data-type="sale">
            <b>일별 매출</b
            ><span class="sub" style="display: block; margin-top: 6px"
              >카드 · 현금 · 계좌이체</span
            ></button
          ><button
            type="button"
            data-action="choose-record"
            data-type="purchase"
          >
            <b>구매 · 지출</b
            ><span class="sub" style="display: block; margin-top: 6px"
              >구매처 · 내용 · 결제금액</span
            ></button
          ><button type="button" data-action="choose-record" data-type="shift">
            <b>근무 · 급여</b
            ><span class="sub" style="display: block; margin-top: 6px"
              >날짜별 출퇴근, 휴게, 시급</span
            ></button
          ><button
            type="button"
            data-action="choose-record"
            data-type="inventory"
          >
            <b>재료 · 재고</b
            ><span class="sub" style="display: block; margin-top: 6px"
              >새 재료와 재고 수량</span
            >
          </button>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" data-action="close-picker">닫기</button>
      </div>
    </dialog>
    <dialog id="modal" aria-labelledby="modalTitle">
      <form id="recordForm">
        <div class="dialog-head">
          <h2 id="modalTitle"></h2>
          <button
            class="ghost"
            type="button"
            data-action="close"
            aria-label="창 닫기"
          >
            ✕
          </button>
        </div>
        <div class="dialog-body" id="formBody"></div>
        <div class="dialog-actions">
          <button type="button" data-action="close">취소</button
          ><button class="primary" type="submit">저장하기</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirmDialog" aria-labelledby="confirmTitle">
      <form method="dialog">
        <div class="dialog-head"><h2 id="confirmTitle">변경 확인</h2></div>
        <div class="dialog-body"><p id="confirmMessage"></p></div>
        <div class="dialog-actions">
          <button value="cancel">취소</button
          ><button value="accept" class="primary">확인</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input
      type="file"
      id="restoreFile"
      accept=".json,application/json"
      hidden
    />
    <script type="module" src="/src/client/app.js"></script>
  </body>
</html>
